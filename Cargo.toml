[package]
authors      = [ "shapeshed <go@margined.io>" ]
categories   = [ "wasm" ]
description  = "An opinionated base vault implementing CosmWasm Vault Standard using Tokenfactory"
edition      = "2021"
homepage     = "https://github.com/margined-protocol/vaultenator"
keywords     = [ "cosmos", "osmosis", "vault" ]
license      = "MIT OR Apache-2.0"
name         = "vaultenator"
publish      = true
readme       = "README.md"
repository   = "https://github.com/margined-protocol/vaultenator"
resolver     = "2"
rust-version = "1.77.2"
version      = "0.6.0"

[lib]
crate-type = [ "cdylib", "rlib" ]

[features]
library = [  ]

[dependencies]
cosmwasm-schema   = "2.1.3"
cosmwasm-std      = "2.1.3"
cw-controllers    = "2.0.0"
cw-storage-plus   = "2.0.0"
cw-utils          = "1.0.3"
cw-vault-standard = "0.3.3"
cw2               = "2.0.0"
neutron-std       = { package = "margined-neutron-std", version = "4.2.0" }
serde             = "1.0.207"
serde_json        = "1.0.115"
thiserror         = "1.0.57"
